spring:
  config:
    # Importa el .env de la raíz del repositorio (o del directorio actual).
    # "optional:" evita que el arranque falle si no existe.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: msa-cuentas
  datasource:
    url: jdbc:postgresql://${DB_CUENTAS_HOST:localhost}:${DB_CUENTAS_PORT:5434}/${DB_CUENTAS_NAME:cuentas_db}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Jackson 3 serializa las fechas en ISO-8601 por defecto: la feature
  # DateTimeFeature.WRITE_DATES_AS_TIMESTAMPS viene desactivada de fabrica.
  # Si hiciera falta el formato numerico, la property es
  # spring.jackson.datatype.datetime.write-dates-as-timestamps
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

# Datos de cliente: son de msa-clientes, asi que se consultan ahi para validar
# que el cliente exista y siga activo antes de abrirle una cuenta.
app:
  ms:
    clientes:
      base-url: ${CLIENTES_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
