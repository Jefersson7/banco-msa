spring:
  application:
    name: msa-clientes
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:clientes_db}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8081}

# Canal de comunicacion asincrona con msa-cuentas
app:
  ms:
    cuentas:
      base-url: ${CUENTAS_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
