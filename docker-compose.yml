name: banco-msa

# Entorno de desarrollo: una base de datos por microservicio.
# Los dos microservicios se agregan a este archivo en la iteracion F7.
services:

  postgres-clientes:
    image: postgres:16-alpine
    container_name: banco-postgres-clientes
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco}
      POSTGRES_DB: ${POSTGRES_DB_CLIENTES:-clientes_db}
    ports:
      - "${POSTGRES_CLIENTES_PORT:-5433}:5432"
    volumes:
      - pgdata-clientes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banco} -d ${POSTGRES_DB_CLIENTES:-clientes_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-cuentas:
    image: postgres:16-alpine
    container_name: banco-postgres-cuentas
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco}
      POSTGRES_DB: ${POSTGRES_DB_CUENTAS:-cuentas_db}
    ports:
      - "${POSTGRES_CUENTAS_PORT:-5434}:5432"
    volumes:
      - pgdata-cuentas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banco} -d ${POSTGRES_DB_CUENTAS:-cuentas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata-clientes:
  pgdata-cuentas:
